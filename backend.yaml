- name: configuring backend
  hosts: backend
  become: yes
  tasks:
  - name: disable nodejs 16
    ansible.builtin.command: " dnf module disable nodejs -y "

  - name: enable nodejs 20
    ansible.builtin.command: " dnf module enable nodejs:20 -y "

  - name: install nodejs 20
    ansible.builtin.dnf:
      name: nodejs
      state: installed
